<div id="login-screen"><div class="login-box"><h1>スケジュール管理</h1><p>メールアドレスでログイン</p><div id="login-err" role="alert" style="display:none"></div><label>メールアドレス<input id="login-id" type="email" autocomplete="username"></label><label>パスワード<input id="login-pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label><button class="btn primary" id="login-submit" onclick="doLogin()">ログイン</button><p><a href="https://tanakapray-web.github.io/-/auth-onboarding/index.html">招待の受け取り・パスワードの再設定</a></p></div></div>

<script src="dom-safety.js"></script>
<script>
// Renderer helpers encode at the output boundary; canonical records remain raw.
const H=DomSafety.text, A=DomSafety.attr, J=DomSafety.eventArg;
// ========== Supabase設定 ==========
window.appAuth = SafeAuth.create({app:'schedule',config:window.APP_CONFIG,
  supabaseFactory:(window.APP_CONFIG?.environment==='test' && ['localhost','127.0.0.1'].includes(location.hostname)) ? window.__SAFE_TEST_SUPABASE_FACTORY__ || window.supabase?.createClient : window.supabase?.createClient,
  onSignedOut:reason=>clearScheduleState(reason)});
let scheduleMutation=null;
const SB = (path, opts={}) => {
  const task=(opts.method||'GET').toUpperCase()==='GET' ? scheduleReadAll(path).then(rows=>Response.json(rows)) : appAuth.request(path,opts);
  if(scheduleMutation && (opts.method||'GET')!=='GET'){
    const batch=scheduleMutation;batch.tasks.push(task);task.catch(e=>batch.errors.push(e));
  }
  return task;
};
async function scheduleReadAll(path){
  const [table,query='']=path.split('?');
  const params=new URLSearchParams(query), rows=[], seen=new Set();
  const user=appAuth.context()?.profile?.auth_user_id, epoch=globalThis._scheduleLoadEpoch;
  const assertCurrent=()=>{if(!user||appAuth.context()?.profile?.auth_user_id!==user||globalThis._scheduleLoadEpoch!==epoch)throw new Error('ログイン状態が変わりました。');};
  // Deterministic ordering and server-reported totals handle caps smaller than a page.
  // Changed totals or duplicate IDs fail visibly rather than publishing a partial sum.
  if(params.has('limit')||params.has('offset'))throw new Error('一覧の取得範囲を確認してください。');
  const order=params.get('order');params.set('order',order?order+(/(^|,)id(\.|,|$)/.test(order)?'':',id'):'id');
  let total=null;
  for(let page=0;page<10000;page++){
    assertCurrent();params.set('offset',String(rows.length));params.set('limit','500');
    const response=await appAuth.request(table+'?'+params.toString(),{headers:{Prefer:'count=exact'}});
    const batch=await response.json();assertCurrent();
    const match=/^(?:\d+-\d+|\*)\/(\d+)$/.exec(response.headers.get('Content-Range')||'');
    if(!Array.isArray(batch)||!match)throw new Error('一覧の件数を確認できません。再読み込みしてください。');
    const count=Number(match[1]);
    if(total!==null&&total!==count)throw new Error('取得中にデータが変わりました。再読み込みしてください。');
    total=count;
    for(const row of batch){if(row.id==null||seen.has(String(row.id)))throw new Error('一覧の整合性を確認できません。再読み込みしてください。');seen.add(String(row.id));rows.push(row);}
    if(rows.length===total)return rows;
    if(!batch.length||rows.length>total)throw new Error('一覧を最後まで取得できません。再読み込みしてください。');
  }
  throw new Error('一覧が大きすぎます。取得範囲を見直してください。');
}
function clearScheduleState(reason){
  globalThis._scheduleLoadEpoch=(globalThis._scheduleLoadEpoch||0)+1;
  globalThis._scheduleSearchEpoch=(globalThis._scheduleSearchEpoch||0)+1;
  S={view:'week',offset:0,deptIdx:0,stores:[],chiefs:{},staff:{},csched:{},ssched:{}};
  SUPABASE_STORES=[];SALES_STORES=[];editCtx=null;CATS_DATA={service:[],route:[]};
  document.body.classList.remove('authenticated');document.getElementById('view-area').replaceChildren();document.getElementById('modal-box').replaceChildren();
  document.getElementById('dept-sel').replaceChildren();document.getElementById('modal-bg').style.display='none';
  document.getElementById('set-body')?.replaceChildren();document.getElementById('search-overlay').style.display='none';
  document.getElementById('search-results')?.replaceChildren();document.getElementById('login-pw').value='';
  document.getElementById('login-screen').style.display='flex';
  if(reason){document.getElementById('login-err').textContent=reason;document.getElementById('login-err').style.display='block';}
}
async function doLogin(){
  const button=document.getElementById('login-submit');if(button.disabled)return;button.disabled=true;
  document.getElementById('login-err').style.display='none';
  try{await appAuth.signIn(document.getElementById('login-id').value,document.getElementById('login-pw').value);document.getElementById('login-pw').value='';await loadData();document.body.classList.add('authenticated');document.getElementById('login-screen').style.display='none';updateScheduleAccessUI();}
  catch(e){document.getElementById('login-err').textContent=e.message;document.getElementById('login-err').style.display='block';}
  finally{button.disabled=false;}
}
async function doLogout(){try{await appAuth.signOut();}catch(e){const el=document.getElementById('login-err');el.textContent=e.message;el.style.display='block';}}
function canEditScheduleDept(di=S.deptIdx){const dept=SUPABASE_STORES[di],scope=appAuth.context()?.schedule;if(!dept||!scope||!scope.view_dept_ids.includes(dept.id))return false;return scope.edit_dept_ids.includes(dept.id)||[dept.store_id,...(dept.linked_store_ids||[])].filter(Boolean).some(id=>scope.edit_store_ids.includes(id));}
function requireScheduleEdit(di=S.deptIdx){if(!canEditScheduleDept(di))throw new SafeAuth.AccessError('この店舗・部署は閲覧のみです。編集権限がありません。');}
function updateScheduleAccessUI(){
  const context=appAuth.context();if(!context)return;
  const editable=canEditScheduleDept();
  document.getElementById('access-label').textContent=!context.schedule.view_dept_ids.length?'閲覧範囲が未設定です。管理者に確認してください。':editable?'担当店舗を編集できます':'閲覧のみ';
  document.querySelectorAll('[data-edit-control]').forEach(el=>{el.disabled=!editable;el.setAttribute('aria-disabled',String(!editable));});
  document.querySelectorAll('[data-settings-control]').forEach(el=>{el.disabled=!context.sales.can_manage_settings;});
}
async function runScheduleMutation(work,scopeCheck=()=>requireScheduleEdit(),describeError=null){
  if(scheduleMutation){alert('保存処理中です。完了までお待ちください。');return false;}
  // Acquire the lock before refreshContext yields, so repeated clicks cannot start two writes.
  const batch={tasks:[],errors:[]};scheduleMutation=batch;
  document.body.classList.add('saving-operation');
  const settle=async()=>{let offset=0;while(offset<batch.tasks.length){const tasks=batch.tasks.slice(offset);offset=batch.tasks.length;await Promise.allSettled(tasks);}};
  try{
    await appAuth.refreshContext();scopeCheck();setStatus('保存中...','saving');
    await work();await settle();
    if(batch.errors.length)throw batch.errors[0];
    if(!batch.tasks.length){scheduleMutation=null;setStatus('変更は保存されていません','');return false;}
    await loadData(describeError);scheduleMutation=null;setStatus('保存しました','saved');return true;
  }catch(e){
    await settle();
    // Never repeat a failed/uncertain request. Refresh only; keep the editor open for review.
    if(appAuth.context()){try{await loadData(describeError);}catch{}}
    const message=describeError?.(e);
    setStatus(message||e.message||'保存結果を確認できません。最新データを確認してください。','error');
    alert(message||e.message||'保存結果を確認できません。再実行前に最新データを確認してください。');return false;
  }finally{scheduleMutation=null;document.body.classList.remove('saving-operation');updateScheduleAccessUI();}
}

  throw new SafeAuth.AccessError(`${label}は安全な一括保存の準備中のため利用できません。データは変更していません。`,409);

function canViewScheduleRoutes(storeId){
  const granted=appAuth.context()?.sales.feature_scopes?.routes?.view_store_ids||[];
  return !!storeId&&granted.includes(storeId)&&SALES_STORES.some(row=>row.id===storeId);

async function loadScheduleStoreDirectory(rows){
  const context=appAuth.context();if(!context)throw new SafeAuth.AccessError('ログインしてください。',401);
  // Never retain unrestricted legacy store payloads even if a test/older server returns extra columns.
  const directory=Array.isArray(rows)?rows.filter(row=>context.schedule.view_store_ids.includes(row.id)).map(({id,name,dept,division,sort_order,created_at})=>({id,name,dept,division,sort_order,created_at})):[];
  const grants=context.sales.feature_scopes?.routes?.view_store_ids||[];
  const ids=directory.map(row=>row.id).filter(id=>grants.includes(id));
  if(!ids.length)return directory;
  const details=await appAuth.readStoreDetails('routes',ids);
  const current=appAuth.context();
  if(!current||current.profile.auth_user_id!==context.profile.auth_user_id)throw new SafeAuth.AccessError('ログイン状態が変わりました。',401);
  const currentGrants=current.sales.feature_scopes?.routes?.view_store_ids||[];
  return directory.map(row=>{
    const detail=ids.includes(row.id)&&currentGrants.includes(row.id)?details.find(item=>item.id===row.id):null;
    return {...row,routes:Array.isArray(detail?.routes)?detail.routes:[]};
  });

// ========== Supabaseからデータ読み込み（GAS不要・完全Supabase一本化）==========
async function loadData(describeError=null){
  const loadEpoch=globalThis._scheduleLoadEpoch=(globalThis._scheduleLoadEpoch||0)+1;
  const loadUser=appAuth.context()?.profile?.auth_user_id;
  const assertCurrentLoad=()=>{if(loadEpoch!==globalThis._scheduleLoadEpoch||!appAuth.context()||appAuth.context()?.profile?.auth_user_id!==loadUser)throw new SafeAuth.AccessError('ログイン状態が変わりました。',401);};
  if(!appAuth.context())throw new SafeAuth.AccessError("ログインしてください。",401);
  try {
    setStatus('読み込み中...','saving');

    const [schedDeptsRes, salesStoresRes, catsRes, schedRes, attendRes, staffRes] = await Promise.all([
      SB('schedule_depts?select=*&order=sort_order,id'),
      SB('stores?select=id,name,dept,division,sort_order,created_at&order=created_at'),
      SB('cats?select=*'),
      (()=>{
      const today=new Date();
      const from=new Date(today);from.setFullYear(from.getFullYear()-1);
      const to=new Date(today);to.setFullYear(to.getFullYear()+1);
      const fromStr=from.toISOString().slice(0,10);
      const toStr=to.toISOString().slice(0,10);
      return SB('schedules?select=*&order=date,chief_index&date=gte.'+fromStr+'&date=lte.'+toStr);
    })(),
      SB('schedule_attendance?select=*'),
      SB('schedule_staff?select=*&order=sort_order,id')
    ]);

    const schedDepts  = await schedDeptsRes.json();assertCurrentLoad();
    const salesStores = await salesStoresRes.json().catch(()=>[]);
    assertCurrentLoad();
    const loadedSalesStores = await loadScheduleStoreDirectory(salesStores);
    const cats        = await catsRes.json();assertCurrentLoad();
    const scheduleRows = await schedRes.json();assertCurrentLoad();
    const schedules = scheduleRows.filter(row=>appAuth.canSchedule({storeId:row.store_id,deptId:row.schedule_dept_id},false));
    const attendances = await attendRes.json();assertCurrentLoad();
    const allStaff    = await staffRes.json().catch(()=>[]);

    assertCurrentLoad();
    SALES_STORES=loadedSalesStores;
    // エラーチェック
    if(!Array.isArray(schedDepts)){
      document.getElementById('view-area').innerHTML=`<div style="padding:20px;color:red;font-size:13px;">⚠ schedule_depts読込エラー: ${H(JSON.stringify(schedDepts).slice(0,200))}</div>`;
      setStatus('読込エラー','error');render();return;
    }

    SUPABASE_STORES = Array.isArray(schedDepts) ? schedDepts.filter(row=>appAuth.context().schedule.view_dept_ids.includes(row.id)) : [];
    if (cats && cats[0]) {
      CATS_DATA.service = cats[0].service || [];
      CATS_DATA.route = []; // Route master choices come only from the explicitly scoped projection.
    }

    // 部署リスト: 各storeを1つの部署として扱う
    S.stores = SUPABASE_STORES.map(s => ({
      id: s.id,
      name: s.name + (s.dept ? ' ' + s.dept : ''),
      depts: ['']
    }));

    // chiefs / staff を schedule_staff テーブルから読み込む（部署削除でも消えない）
    S.chiefs = {};
    S.staff = {};
    const staffArr = Array.isArray(allStaff) ? allStaff : [];
    SUPABASE_STORES.forEach((dept, i) => {
      const stableId = dept.store_id || dept.id; // 売上アプリのstore_id（安定）を優先
      const dk = `d${i}`;
      S.chiefs[dk] = staffArr.filter(p => p.store_id === stableId && p.type === 'chief').sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
      S.staff[dk]  = staffArr.filter(p => p.store_id === stableId && p.type === 'staff').sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    });

    // 出勤データを schedule_attendance から読み込む（getSschedと同じネスト構造で格納）
    S.ssched = {};
    if (attendances && attendances.length) {
      attendances.forEach(rec => {
        if(!rec.data)return;
        SUPABASE_STORES.forEach((dept,si)=>{
          if((dept.store_id||dept.id)!==rec.store_id)return;
          const dk=`d${si}`;if(!S.ssched[dk])S.ssched[dk]={};
          Object.entries(rec.data).forEach(([key,value])=>{S.ssched[dk][key]=value;});
        });
      });
    }

    // 現場予定はSupabaseを唯一の正とする（GAS由来は使わず毎回作り直す → 2重表示・消失を防止）
    S.csched = {};
    if (schedules && schedules.length) {
      schedules.forEach(row => {
        const dk = row.date;
        // 部署の特定: schedule_dept_id > store_id > dept名 の順で優先
        let di = 0;
        if (row.schedule_dept_id) {
          const idx = SUPABASE_STORES.findIndex(s => s.id === row.schedule_dept_id);
          di = idx >= 0 ? idx : getDeptIndexByDept(row.store_id || row.dept || '');
        } else {
          di = row.store_id ? getDeptIndexByDept(row.store_id) : (row.dept ? getDeptIndexByDept(row.dept) : 0);
        }
        // チーフのインデックス: chief_name があれば名前でマッチ、なければ chief_index
        let mi = row.chief_index || 0;
        if (row.chief_name) {
          const chiefs = S.chiefs[`d${di}`] || [];
          const byName = chiefs.findIndex(c => c.name === row.chief_name);
          if (byName >= 0) mi = byName;
        }
        const dkey_str = `d${di}`;
        if (!S.csched[dkey_str]) S.csched[dkey_str] = {};
        const key = `${dk}__${mi}`;
        if (!S.csched[dkey_str][key]) S.csched[dkey_str][key] = [];
        // 同名エントリがなければ追加
        const exists = S.csched[dkey_str][key].find(e => e.name === row.name && e.supabase_id === row.id);
        if (!exists) {
          S.csched[dkey_str][key].push({
            name: row.name || '',
            start: row.start_time || '',
            end: row.end_time || '',
            note: row.note || '',
            color: (row.color !== undefined && row.color !== null) ? row.color : (row.store_id ? getStoreColor(row.store_id) : 0),
            repeatId: row.repeat_id || undefined,
            supabase_id: row.id,
            _persistedLocation:{pray_revision:row.pray_revision,id:row.id,date:row.date,chief_index:row.chief_index??null,chief_name:row.chief_name??null,store_id:row.store_id??null,schedule_dept_id:row.schedule_dept_id??null},
            store_id: row.store_id || '',
            schedule_dept_id: row.schedule_dept_id || '',
            dept: row.dept || '',
            category: row.category || '',
            route: row.route || '',
            amount: row.amount || null,
            schedule_type: row.schedule_type || 'service',
            staff_names: Array.isArray(row.staff_names) ? row.staff_names : [],
          });
        }
      });
    }

    setStatus('最終読込: '+new Date().toLocaleTimeString('ja-JP'),'saved');
    // Browser-side automatic archive is deliberately disabled; use a reviewed atomic server job.
  } catch(e) {
    if(loadEpoch!==globalThis._scheduleLoadEpoch||appAuth.context()?.profile?.auth_user_id!==loadUser)throw e;
    console.error('loadData error:', e);
    const message=describeError?.(e);
    document.getElementById('view-area').innerHTML=`<div style="padding:20px;color:red;font-size:13px;">⚠ 読込エラー: ${H(message||e.message||e)}${message?'':'<br>詳細はF12のConsoleを確認してください'}</div>`;
    setStatus('読込エラー: '+(message||e.message),'error');throw e;
  }
  assertCurrentLoad();render();updateScheduleAccessUI();
}

function getDeptIndexByDept(deptOrId) {
  if(!deptOrId) return 0;
  let idx = SUPABASE_STORES.findIndex(s => s.id === deptOrId);
  if (idx >= 0) return idx;
  idx = SUPABASE_STORES.findIndex(s => s.store_id === deptOrId);
  if (idx >= 0) return idx;
  // linked_store_ids（スケジュール専用部署に複数の売上店舗を紐づける）
  idx = SUPABASE_STORES.findIndex(s => Array.isArray(s.linked_store_ids) && s.linked_store_ids.includes(deptOrId));
  if (idx >= 0) return idx;
  const depts = getDepts();
  idx = depts.findIndex(d => d.label.includes(deptOrId));
  return idx >= 0 ? idx : 0;
}

// ========== Supabaseに保存 ==========
function newScheduleId(){
  if(!globalThis.crypto?.randomUUID)throw new SafeAuth.AccessError('安全な保存IDを作成できません。対応ブラウザーを使用してください。',409);
  return 'schedule_'+crypto.randomUUID();
}
function scheduleRecord(entry,dk,mi,di=S.deptIdx){
  const dept=getDepts()[di],deptId=SUPABASE_STORES[di]?.id;
  if(!deptId||!getChiefs(di)[mi]||!/^\d{4}-\d{2}-\d{2}$/.test(dk))throw new SafeAuth.AccessError('保存先の日付・部署・チーフを確認してください。',409);
  return {
    id:entry.supabase_id||newScheduleId(),date:dk,chief_index:mi,
    store_id:entry.store_id||null,dept:dept?.label||'',name:entry.name,
    start_time:entry.start||null,end_time:entry.end||null,note:entry.note||null,
    color:entry.color||0,repeat_id:entry.repeatId||null,category:entry.category||null,
    route:entry.route||null,amount:entry.amount?parseInt(entry.amount):null,
    schedule_type:entry.schedule_type||'service',staff_names:Array.isArray(entry.staff_names)?entry.staff_names:[],
    chief_name:getChiefs(di)[mi]?.name||entry.chief_name||'',schedule_dept_id:deptId,
  };
}
async function verifiedScheduleWrite(path,opts,expectedIds){
  const response=await SB(path,opts);
  if(!response.ok)throw new SafeAuth.AccessError('保存結果を確認できません。最新データを確認してください。',response.status);
  let rows;try{rows=await response.json();}catch{throw new SafeAuth.AccessError('保存結果を確認できません。再実行前に最新データを確認してください。',409);}
  const actualIds=Array.isArray(rows)?rows.map(row=>row.id):[];
  if(actualIds.length!==expectedIds.length || new Set(actualIds).size!==expectedIds.length || expectedIds.some(id=>!actualIds.includes(id))){
    throw new SafeAuth.AccessError('対象の保存結果が一致しません。再実行前に最新データを確認してください。',409);
  }
  return rows;
}
async function insertScheduleBatch(items){
  if(!items.length)return false;
  // A plain INSERT array is one database statement: a denied or invalid row rejects the entire set.
  // Do not use upsert here: every row must be new and duplicates must fail rather than overwrite.
  const rows=items.map(({entry,dk,mi,di})=>scheduleRecord(entry,dk,mi,di));
  if(rows.some((row,i)=>items[i].entry.supabase_id)||new Set(rows.map(row=>row.id)).size!==rows.length)throw new SafeAuth.AccessError('新規登録データを確認してください。',409);
  await verifiedScheduleWrite('schedules',{method:'POST',body:JSON.stringify(rows)},rows.map(row=>row.id));
  return true;
}
async function saveToSupabase(entry,dk,mi,di=S.deptIdx){
  const record=scheduleRecord(entry,dk,mi,di);
  return verifiedScheduleWrite(entry.supabase_id?`schedules?id=eq.${encodeURIComponent(entry.supabase_id)}`:'schedules',{
    method:entry.supabase_id?'PATCH':'POST',body:JSON.stringify(record),headers:entry.supabase_id?SafeAuth.revisionHeaders(entry._persistedLocation?.pray_revision):{},
  },[record.id]);
}

function today(){return new Date()}
function mondayOf(d){const r=new Date(d);const dw=r.getDay();r.setDate(r.getDate()+(dw===0?-6:1-dw));return r}
function dateKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDateKey(dk){const[y,m,d]=dk.split('-').map(Number);return new Date(y,m-1,d)}
function fmtS(d){return`${d.getMonth()+1}/${d.getDate()}`}
function fmtDow(d){return DOWS[d.getDay()]}
function isToday(d){return dateKey(d)===dateKey(today())}

function getBase(){const t=today();if(S.view==='day'){const d=new Date(t);d.setDate(d.getDate()+S.offset);return d}if(S.view==='week'){const m=mondayOf(t);m.setDate(m.getDate()+S.offset*7);return m}return new Date(t.getFullYear(),t.getMonth()+S.offset,1)}
function sortE(e){return[...e].sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}

function getRepeatDates(startDk, repeat){
  const dates=[];const start=parseDateKey(startDk);const end=new Date(start);end.setFullYear(end.getFullYear()+1);let cur=new Date(start);
  cur.setDate(cur.getDate()+(repeat==='biweekly'?7:repeat==='weekly'?7:0));
  if(repeat==='weekly'||repeat==='biweekly'){const step=repeat==='biweekly'?14:7;while(cur<=end){dates.push(dateKey(cur));cur.setDate(cur.getDate()+step);}}
  else if(repeat==='monthly'||repeat.startsWith('every')){let months=1;if(repeat==='every2m')months=2;else if(repeat==='every3m')months=3;else if(repeat==='every4m')months=4;else if(repeat==='every5m')months=5;else if(repeat==='every6m')months=6;
    cur=new Date(start);cur.setMonth(cur.getMonth()+months);while(cur<=end){dates.push(dateKey(cur));cur.setMonth(cur.getMonth()+months);}}
  return dates;
}

function getEntryColor(e) {
  // Untrusted database values select a fixed palette index; they never become CSS.
  const color = Number(e.color);
  if (e.color !== undefined && e.color !== null && Number.isInteger(color) && color >= 0 && color < ECOLORS.length) return color;
  // デフォルトは店舗カラー
  if (e.store_id) return getStoreColor(e.store_id);
  return 0;
}

function attendanceErrorMessage(error){
  // Only this code/status pair confirms a business conflict. Never show backend or transport text.
  if(error?.code==='PT409'&&error?.status===409)return '出勤情報またはスタッフ一覧が変更されています。最新表示を確認してから入力してください。';
  if(error instanceof SafeAuth.AccessError&&[
    'スタッフ一覧を再読み込みして確認してください。','出勤情報を確認してください。',
    '出勤変更の入力項目を確認してください。','出勤変更の対象を確認してください。',
    '日付・スタッフを確認してください。','出勤状態を確認してください。'
  ].includes(error.message))return '出勤情報の入力を確認してください。日付・スタッフ・出勤状態を再読み込みして確認してください。';
  if(error?.status===401)return 'ログイン状態を確認できません。再ログイン後に最新表示を確認してから操作してください。';
  if(error?.status===403)return '出勤情報の操作権限を確認できません。権限と最新表示を確認してください。';
  if(error?.status===400||error?.status===422)return '出勤情報の入力を確認してください。日付・スタッフ・出勤状態を再読み込みして確認してください。';
  return '出勤情報の保存結果は未確認です。再実行する前に、再読み込みして最新の状態を確認してください。';
}
async function toggleStaff(dk,si,di=S.deptIdx){

  if(!dept||!staff?.id||!Number.isInteger(si)||si<0)throw new SafeAuth.AccessError('スタッフ一覧を再読み込みして確認してください。');
  const key=dk+'__'+si,expected=getSsched(di)[key]||'';
  if(!['','出勤','休日'].includes(expected))throw new SafeAuth.AccessError('出勤情報を確認してください。');
  const value=expected===''?'出勤':expected==='出勤'?'休日':'';
  const params={p_dept_id:dept.id,p_scope_id:dept.store_id||dept.id,p_date:dk,p_staff_id:staff.id,p_staff_index:si,p_expected_value:expected,p_value:value};
  const task=appAuth.setAttendanceCell(params);
  if(scheduleMutation){const batch=scheduleMutation;batch.tasks.push(task);task.catch(error=>batch.errors.push(error));}
  await task;
  // No optimistic local commit: runScheduleMutation reloads every affected view only after acknowledgement.
}

async function doMove(){

  if(src.length!==1||src[0]!==editCtx.mi||selected.length!==1)requireAtomicScheduleOperation('複数予定・複数移動先への移動');
  const chief=getChiefs(targetDi)[selected[0]],date=document.getElementById('mv-date').value;
  if(!target||!chief||!Number.isInteger(selected[0])||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Date.parse(date))||new Date(date).toISOString().slice(0,10)!==date)throw new SafeAuth.AccessError('移動先の日付・部署・チーフを確認してください。');
  appAuth.assertSchedule({storeId:target.store_id||undefined,deptId:target.id},true);
  const sourceDept=SUPABASE_STORES[S.deptIdx];appAuth.assertSchedule({storeId:sourceDept.store_id||undefined,deptId:sourceDept.id},true);
  const proposed={date,schedule_dept_id:target.id,chief_index:selected[0],chief_name:chief.name||null};

function resolveEditRecord(){
  const ctx=editCtx,dept=SUPABASE_STORES[S.deptIdx];
  if(!ctx?.sourceId||!dept||dept.id!==ctx.deptId)throw new SafeAuth.AccessError('編集対象の部署が変更されています。予定を開き直してください。',409);
  const found=(getCsched(S.deptIdx)[ctx.dk+'__'+ctx.mi]||[]).filter(entry=>entry.supabase_id===ctx.sourceId);
  if(found.length!==1||(found[0].store_id||'')!==ctx.sourceStoreId||(found[0].schedule_dept_id||'')!==ctx.sourceDeptId)throw new SafeAuth.AccessError('編集対象の予定が変更・移動されています。予定を開き直してください。',409);
  return found[0];
}

function capturedSchedulePath(){
  const source=editCtx?.sourceLocation;
  if(!source||source.id!==editCtx.sourceId)throw new SafeAuth.AccessError('予定を開き直してください。',409);
  const keys=['id','date','schedule_dept_id','store_id','chief_index','chief_name'];
  return 'schedules?'+keys.map(key=>key+'='+(source[key]===null?'is.null':'eq.'+encodeURIComponent(String(source[key])))).join('&');
}
async function patchCapturedSchedule(changes){
  const original=resolveEditRecord(),source=editCtx.sourceLocation;
  const allowed=['date','chief_index','chief_name','schedule_dept_id','dept','store_id','name','start_time','end_time','note','color','category','route','amount','schedule_type','staff_names'];
  if(!changes||Object.keys(changes).some(key=>!allowed.includes(key)))throw new SafeAuth.AccessError('変更項目を確認してください。');
  const oldScope={storeId:source.store_id,deptId:source.schedule_dept_id};
  const newScope={storeId:Object.hasOwn(changes,'store_id')?changes.store_id:source.store_id,deptId:changes.schedule_dept_id||source.schedule_dept_id};
  appAuth.assertSchedule(oldScope,true);appAuth.assertSchedule(newScope,true);
  if(!Object.keys(changes).length)return false;
  await verifiedScheduleWrite(capturedSchedulePath(),{method:'PATCH',body:JSON.stringify(changes),headers:SafeAuth.revisionHeaders(source.pray_revision)},[original.supabase_id]);
  return true;
}

async function saveEntry(){
  const di=S.deptIdx,dk=document.getElementById('f-date').value;
  const checkedMis=[...new Set([...document.querySelectorAll('input[name="f-member-cb"]:checked')].map(cb=>parseInt(cb.value)))];
  const name=document.getElementById('f-name').value.trim();
  if(!dk||!name||!checkedMis.length){alert('日付・現場名・チーフを入力してください');return false;}
  const start=getTime('f-start'),end=getTime('f-end'),note=document.getElementById('f-note').value.trim();
  const repeat=document.getElementById('f-repeat')?.value||'none';
  const sales=getSalesFields(),staff_names=getSelectedStaff();
  const color=parseInt(document.getElementById('f-color')?.value||0);
  let endDate=new Date(parseDateKey(dk));endDate.setFullYear(endDate.getFullYear()+1);
  const endInput=document.getElementById('f-repeat-end')?.value;
  if(endInput){const p=endInput.split('/');if(p.length===3)endDate=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
  const dates=repeat==='none'?[dk]:[...new Set([dk,...getRepeatDates(dk,repeat).filter(rdk=>parseDateKey(rdk)<=endDate)])];
  const items=[];
  for(const mi of checkedMis){
    const repeatId=repeat==='none'?undefined:'repeat_'+newScheduleId();
    for(const date of dates)items.push({entry:{name,start,end,note,color,repeatId,...sales,staff_names},dk:date,mi,di});
  }
  await insertScheduleBatch(items);closeModal();return true;
}
async function updateEntry(){
  if(!editCtx)return false;
  const{dk,mi,origIdx}=editCtx,di=S.deptIdx;
  const name=document.getElementById('f-name').value.trim();if(!name){alert('現場名を入力してください');return false;}
  const checkedMis=[...new Set([...document.querySelectorAll('input[name="f-member-cb"]:checked')].map(cb=>parseInt(cb.value)))];
  if(checkedMis.length!==1)requireAtomicScheduleOperation('複数チーフの更新');
  if(!getChiefs(di)[checkedMis[0]])throw new SafeAuth.AccessError('チーフを確認してください。');
  const e=resolveEditRecord();
  if(checkedMis[0]!==mi){const targetDept=SUPABASE_STORES[di];appAuth.assertSchedule({storeId:targetDept.store_id||undefined,deptId:targetDept.id},true);}
  if(!e?.supabase_id)throw new SafeAuth.AccessError('更新対象が見つかりません。最新データを確認してください。',409);
  const updated={...e,name,start:getTime('f-start'),end:getTime('f-end'),note:document.getElementById('f-note').value.trim(),
    color:parseInt(document.getElementById('f-color')?.value||0),...getSalesFields(),staff_names:getSelectedStaff()};
  const oldRecord=scheduleRecord(e,dk,mi,di),newRecord=scheduleRecord(updated,dk,checkedMis[0],di);
  const changes=Object.fromEntries(Object.entries(newRecord).filter(([key,value])=>key!=='id'&&key!=='repeat_id'&&JSON.stringify(value)!==JSON.stringify(oldRecord[key])));
  const changed=await patchCapturedSchedule(changes);if(changed)closeModal();return changed;
}

function exportCSV(){
  const di=S.deptIdx,chiefs=getChiefs(di),staff=getStaff(di),csched=getCsched(di),ssched=getSsched(di);
  const base=getBase();let dates=[];
  if(S.view==='week'){dates=Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(d.getDate()+i);return d});}
  else if(S.view==='month'){const year=base.getFullYear(),month=base.getMonth();const lastDay=new Date(year,month+1,0).getDate();dates=Array.from({length:lastDay},(_,i)=>new Date(year,month,i+1));}
  else{dates=[base];}
  let csv='\uFEFF日付,曜日';
  chiefs.forEach(m=>csv+=`,${m.name}（現場）,${m.name}（時間）,${m.name}（備考）,${m.name}（店舗）,${m.name}（区分）,${m.name}（受注経路）,${m.name}（金額）`);
  staff.forEach(s=>csv+=`,${s.name}`);csv+='\n';
  dates.forEach(d=>{
    const dk=dateKey(d);
    const maxE=Math.max(1,...chiefs.map((_,mi)=>(csched[`${dk}__${mi}`]||[]).length));
    for(let ei=0;ei<maxE;ei++){
      csv+=ei===0?`${fmtS(d)},${fmtDow(d)}`:`${fmtS(d)},`;
      chiefs.forEach((_,mi)=>{const entries=sortE(csched[`${dk}__${mi}`]||[]);const e=entries[ei];
        if(e){const time=e.start?(e.end?`${e.start}〜${e.end}`:`${e.start}〜`):'';
          const storeName=e.store_id?(SUPABASE_STORES.find(s=>s.id===e.store_id)?.name||''):'';
          csv+=`,"${e.name}","${time}","${e.note||''}","${storeName}","${e.category||''}","${e.route||''}","${e.amount||''}"`;
        }else{csv+=',,,,,,,';} });
      if(ei===0){staff.forEach((_,si)=>{const v=ssched[`${dk}__${si}`]||'';csv+=`,"${v}"`;});}
      else{staff.forEach(()=>csv+=',');}csv+='\n';}});
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`schedule_${fmtS(base).replace('/','')}.csv`;a.click();URL.revokeObjectURL(url);
}

async function delSchedDept(i){
  if(!confirm('この部署を削除しますか？チーフ・スタッフ情報も削除されます。\n（この部署の予定データはSupabaseに残ります）'))return;
  const s=SUPABASE_STORES[i];
  await SB(`schedule_depts?id=eq.${encodeURIComponent(s.id)}`,{method:'DELETE'});
  SUPABASE_STORES.splice(i,1);
  // インデックスを詰める
  const newChiefs={},newStaff={},newCsched={};
  SUPABASE_STORES.forEach((_,ni)=>{
    newChiefs[`d${ni}`]=S.chiefs[`d${ni<i?ni:ni+1}`]||[];
    newStaff[`d${ni}`]=S.staff[`d${ni<i?ni:ni+1}`]||[];
    newCsched[`d${ni}`]=S.csched[`d${ni<i?ni:ni+1}`]||{};
  });
  S.chiefs=newChiefs;S.staff=newStaff;S.csched=newCsched;
  if(S.deptIdx>=SUPABASE_STORES.length)S.deptIdx=0;
  render();setTab('store');toast('削除しました');
}

let _searchTimer=null;
async function searchSchedule(){
  const q=document.getElementById('search-input').value.trim();
  const storeId=document.getElementById('search-store').value;
  const res=document.getElementById('search-results');
  if(q.length<1){res.innerHTML='<div style="text-align:center;color:#aaa;padding:24px;font-size:13px;">現場名を入力してください</div>';return;}
  res.innerHTML='<div style="text-align:center;color:#aaa;padding:24px;font-size:13px;">検索中...</div>';
  // debounce
  clearTimeout(_searchTimer);
  const searchEpoch=globalThis._scheduleSearchEpoch=(globalThis._scheduleSearchEpoch||0)+1;
  _searchTimer=setTimeout(async()=>{
    if(searchEpoch!==globalThis._scheduleSearchEpoch)return;
    try{
    let params=`?name=ilike.*${encodeURIComponent(q)}*&select=*&order=date.desc`;
    if(storeId)params+=`&store_id=eq.${encodeURIComponent(storeId)}`;
    const r=await SB('schedules'+params);
    const data=(await r.json()).filter(row=>appAuth.canSchedule({storeId:row.store_id,deptId:row.schedule_dept_id}));
    if(searchEpoch!==globalThis._scheduleSearchEpoch)return;
    if(!data||!data.length){res.innerHTML='<div style="text-align:center;color:#aaa;padding:24px;font-size:13px;">該当する予定が見つかりませんでした</div>';return;}
    const today_str=dateKey(today());
    const rows=data.map(row=>{
      const storeName=SALES_STORES.find(s=>s.id===row.store_id)?.name||row.dept||'';
      const chief=row.chief_name||'';
      const isPast=row.date<today_str;
      const timeStr=row.start_time?(row.end_time?`${row.start_time}〜${row.end_time}`:`${row.start_time}〜`):'';
      return`<div onclick="jumpToDate(${J(row.date)},${J(row.store_id||'')});closeSearch();" style="padding:12px 20px;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:12px;" onmouseover="this.style.background='#f8f8f8'" onmouseout="this.style.background=''">
        <div style="font-size:12px;color:${isPast?'#aaa':'#1d9e75'};min-width:90px;font-weight:600;">${H(row.date)}</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:600;">${H(row.name)}</div>
          <div style="font-size:11px;color:#aaa;margin-top:2px;">${H([storeName,chief,timeStr].filter(Boolean).join(' · '))}</div>
        </div>
        <div style="font-size:11px;color:#bbb;">${isPast?'過去':'予定'}</div>
      </div>`;
    });
    res.innerHTML=rows.join('');
    }catch(error){if(searchEpoch===globalThis._scheduleSearchEpoch)res.textContent=error.message||'検索に失敗しました。';}
  },300);
}
function jumpToDate(dateStr,storeId){
  // 対象の部署インデックスを特定
  if(storeId){
    const di=getDeptIndexByDept(storeId);
    if(di>=0&&di!==S.deptIdx){
      S.deptIdx=di;
      document.getElementById('dept-sel').value=di;
    }
  }
  // 日付からoffsetを計算して週表示でジャンプ
  const target=parseDateKey(dateStr);
  const t=today();
  if(S.view==='week'){
    const targetMon=mondayOf(target);
    const todayMon=mondayOf(t);
    S.offset=Math.round((targetMon-todayMon)/(7*24*60*60*1000));
  } else if(S.view==='month'){
    S.offset=(target.getFullYear()-t.getFullYear())*12+(target.getMonth()-t.getMonth());
  } else {
    const diff=Math.round((target-t)/(24*60*60*1000));
    S.offset=diff;
  }
  render();
}
function getStableId(di){ const dept=SUPABASE_STORES[di]; return dept?(dept.store_id||dept.id):null; }
async function addChief(){
  const n=document.getElementById('new-chief')?.value.trim();
  if(!n){alert('名前を入力してください');return;}
  const stableId=getStableId(S.deptIdx);
  if(!stableId){alert('部署が取得できません。deptIdx:'+S.deptIdx+' STORES:'+SUPABASE_STORES.length);return;}
  const newP={id:'sc_'+Date.now(),store_id:stableId,name:n,type:'chief',sort_order:(S.chiefs[`d${S.deptIdx}`]||[]).length};
  const res=await SB('schedule_staff',{method:'POST',body:JSON.stringify(newP)});
  if(res.ok){
    if(!S.chiefs[`d${S.deptIdx}`])S.chiefs[`d${S.deptIdx}`]=[];
    S.chiefs[`d${S.deptIdx}`].push(newP);
    render();renderChiefTab();
    document.getElementById('new-chief').value='';
    setStatus('保存しました','saved');
  }else{
    const txt=await res.text();
    alert('保存に失敗しました: '+res.status+' '+txt);
  }
}

  const all = [];
  getDepts().forEach((_,i) => {
    const chiefs = viewMonth ? getDisplayChiefs(i,viewMonth) : getChiefs(i).map((c,idx)=>({...c,_idx:idx}));
    chiefs.forEach(c => all.push({...c, _di:i, _ci:c._idx}));

    const staff = viewMonth ? getDisplayStaff(i,viewMonth) : getStaff(i).map((s,idx)=>({...s,_idx:idx}));

}
